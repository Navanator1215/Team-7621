<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driscoll's R&D Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   <style>
        body {
            background: #f4f7fb;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: #1f2937;
        }

        .page-header {
            background: linear-gradient(135deg, #0d6efd, #3b82f6);
            color: white;
            padding: 2.5rem 0;
            margin-bottom: 2rem;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
        }

        .page-header h1 {
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            margin: 0;
            opacity: 0.9;
            font-size: 1rem;
        }

        .dashboard-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
        }

        .stat-label {
            font-size: 0.95rem;
            color: #6b7280;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: #0d6efd;
            margin: 0;
        }

        .section-title {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #111827;
        }

        .form-card {
            background: white;
            padding: 2rem;
        }

        .form-label {
            font-weight: 600;
            color: #374151;
        }

        .btn-primary {
            border-radius: 0.75rem;
            font-weight: 600;
            padding: 0.7rem 1.2rem;
        }

        .form-control,
        .form-select {
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.2);
        }

        .upload-note {
            font-size: 0.9rem;
            color: #6b7280;
        }

        .content-wrapper {
            margin-bottom: 3rem;
        }
    </style>
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="text-center mb-2">Driscoll's R&D Platform</h1>
    <p class="text-center text-muted mb-4">
      Manage and analyze agricultural field trials
    </p>

    {% include "partials/summary_cards.html" %}
    {% include "partials/trial_form.html" %}

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="mb-0">Field Trials</h2>
    </div>

    {% include "partials/search_filter.html" %}
    {% include "partials/trial_table.html" %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
