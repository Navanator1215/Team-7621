<div class="row g-3 mb-4">

  <div class="col-md-3">
    <div class="card shadow-sm text-center p-3">
      <h6 class="text-muted mb-2">Total Trials</h6>
      <h3>{{ total }}</h3>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card shadow-sm text-center p-3">
      <h6 class="text-muted mb-2">Active</h6>
      <h3>{{ active }}</h3>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card shadow-sm text-center p-3">
      <h6 class="text-muted mb-2">Completed</h6>
      <h3>{{ completed }}</h3>
    </div>
  </div>

  <div class="col-md-3">
    <div class="card shadow-sm text-center p-3">
      <h6 class="text-muted mb-2">Planned</h6>
      <h3>{{ planned }}</h3>
    </div>
  </div>

</div>
